
name: Check Nagham Build Setup

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect project scripts
        run: |
          set -e
          mkdir app-source
          unzip -q nagham-music-app-development.zip -d app-source
          cd app-source
          echo "===== PACKAGE JSON ====="
          cat package.json
          echo "===== APK BUILD SCRIPT ====="
          sed -n '1,180p' scripts/build-apk.mjs
          echo "===== ANDROID FILES ====="
          ls -la android
          echo "===== GRADLE WRAPPER ====="
          find android -maxdepth 3 -type f -name 'gradlew*'
